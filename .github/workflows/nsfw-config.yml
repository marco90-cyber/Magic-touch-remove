name: NSFW preprocessing config

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install transformers==4.44.2 huggingface_hub==0.25.2 pillow numpy"<2" 
          python - <<'PY'
          from transformers import AutoImageProcessor
          p = AutoImageProcessor.from_pretrained("Falconsai/nsfw_image_detection").to_dict()
          keep = {k: v for k, v in p.items() if k in ("size","image_mean","image_std","do_normalize","do_rescale","rescale_factor","resample","do_resize")}
          print(f"::notice title=PRE::{keep}")
          PY
