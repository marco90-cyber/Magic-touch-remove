name: Export Stable Diffusion ONNX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install
        run: |
          set -o pipefail
          {
            pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
            pip install "numpy<2" diffusers==0.30.3 transformers==4.44.2 peft==0.12.0 accelerate==0.34.2 \
              huggingface_hub==0.25.2 safetensors onnx==1.16.2 onnxruntime==1.19.2 onnxconverter-common==1.14.0 \
              scikit-image pillow
          } 2>&1 | tee install.log || { tail -n 25 install.log | while IFS= read -r l; do echo "::error::${l}"; done; exit 1; }
      - name: Export and verify
        working-directory: tools/sd
        run: |
          set -o pipefail
          python export_sd.py "$GITHUB_WORKSPACE/out" 2>&1 | tee "$GITHUB_WORKSPACE/export.log"
      - name: Show log tail as annotation
        if: always()
        run: |
          tail -n 45 export.log 2>/dev/null | while IFS= read -r l; do echo "::notice::${l}"; done
      - name: Publish release sd-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sd-v1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create sd-v1 out/*.onnx out/*.json out/*.txt out/*.png --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Stable Diffusion 1.5 Inpainting (ONNX fp16)" \
            --notes "SD 1.5 Inpainting (CreativeML OpenRAIL-M, RunwayML/Stability AI) e versione LCM (LCM-LoRA, OpenRAIL++) convertiti in ONNX fp16. Sperimentale."
