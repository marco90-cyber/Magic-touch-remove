name: Modello profondità

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scarica e verifica Depth Anything V2 Small
        run: |
          pip install huggingface_hub onnxruntime numpy onnx > pip.txt 2>&1 || { echo "::error::$(tail -n 4 pip.txt | tr '\n' ' ')"; exit 1; }
          cat > get.py <<'PY'
          import hashlib, os, shutil, numpy as np, onnxruntime as ort
          from huggingface_hub import hf_hub_download
          p = hf_hub_download("onnx-community/depth-anything-v2-small", "onnx/model.onnx")
          os.makedirs("out", exist_ok=True)
          dst = "out/depth_anything_v2_small.onnx"
          shutil.copy(p, dst)
          s = ort.InferenceSession(dst, providers=["CPUExecutionProvider"])
          i = s.get_inputs()[0]; o = s.get_outputs()[0]
          x = np.random.rand(1, 3, 518, 518).astype(np.float32)
          y = s.run(None, {i.name: x})[0]
          sha = hashlib.sha256(open(dst, "rb").read()).hexdigest()
          print(f"::notice title=DEPTH::size={os.path.getsize(dst)} sha={sha} in={i.name}{i.shape} out={o.name}{o.shape} got={y.shape} min={y.min():.3f} max={y.max():.3f}")
          PY
          python get.py > log.txt 2>&1 || { echo "::error::$(tail -n 6 log.txt | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          cat log.txt
      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete depth-v1 -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create depth-v1 out/depth_anything_v2_small.onnx -R "$GITHUB_REPOSITORY" \
            -t "Modello di profondità" \
            -n "Depth Anything V2 Small (Apache-2.0), versione ONNX di onnx-community: serve alla funzione Sfocatura sfondo."
