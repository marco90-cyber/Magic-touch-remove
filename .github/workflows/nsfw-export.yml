name: Export NSFW checker ONNX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          pip install "numpy<2" transformers==4.44.2 huggingface_hub==0.25.2 safetensors onnx==1.16.2 onnxruntime==1.19.2 pillow
      - name: Export and verify
        run: python -W ignore tools/nsfw/export_nsfw.py "$GITHUB_WORKSPACE/out" 2>&1 | tee export.log
      - name: Publish release nsfw-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nsfw-v1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nsfw-v1 out/nsfw_vit_fp32.onnx --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Controllo di sicurezza (ONNX)" \
            --notes "Falconsai/nsfw_image_detection (Apache-2.0) convertito in ONNX fp32. Usato per scartare risultati inappropriati dell'IA generativa."
