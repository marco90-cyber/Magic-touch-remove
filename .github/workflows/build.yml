name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only_models:
        description: "Solo pubblicazione modelli (niente build APK)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  model:
    # Pubblica una sola volta il modello LaMa come asset di backup (l'app lo scarica al primo avvio)
    runs-on: ubuntu-latest
    steps:
      - name: Publish model release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view model-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "model release already exists"; exit 0
          fi
          curl -L --fail --retry 3 -o lama_fp32.onnx \
            https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx
          gh release create model-v1 lama_fp32.onnx --repo "$GITHUB_REPOSITORY" \
            --latest=false --title "LaMa ONNX model" \
            --notes "LaMa (big-lama, Apache-2.0) esportato in ONNX da Carve/LaMa-ONNX. Scaricato dall'app al primo avvio."

      - name: Publish MobileSAM release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view sam-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "sam release already exists"; exit 0
          fi
          mkdir sam
          curl -L --fail --retry 3 -o sam/mobile_sam_image_encoder.onnx \
            https://huggingface.co/Acly/MobileSAM/resolve/main/mobile_sam_image_encoder.onnx
          curl -L --fail --retry 3 -o sam/sam_mask_decoder_single.onnx \
            https://huggingface.co/Acly/MobileSAM/resolve/main/sam_mask_decoder_single.onnx
          gh release create sam-v1 sam/*.onnx --repo "$GITHUB_REPOSITORY" \
            --latest=false --title "MobileSAM ONNX" \
            --notes "MobileSAM (MIT) in formato ONNX da Acly/MobileSAM. Scaricato dall'app per la selezione automatica degli oggetti."

      - name: Upload MobileSAM multi-mask decoder if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view sam-v1 --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -q sam_mask_decoder_multi.onnx; then
            echo "multi decoder already uploaded"; exit 0
          fi
          curl -L --fail --retry 3 -o sam_mask_decoder_multi.onnx \
            https://huggingface.co/Acly/MobileSAM/resolve/main/sam_mask_decoder_multi.onnx
          gh release upload sam-v1 sam_mask_decoder_multi.onnx --repo "$GITHUB_REPOSITORY"

      - name: Publish MI-GAN and SAM 2 releases if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view migan-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p migan
            curl -L --fail --retry 3 -o migan/migan_pipeline_v2.onnx \
              https://huggingface.co/andraniksargsyan/migan/resolve/main/migan_pipeline_v2.onnx
            gh release create migan-v1 migan/*.onnx --repo "$GITHUB_REPOSITORY" --latest=false \
              --title "MI-GAN ONNX" --notes "MI-GAN (MIT, Picsart AI Research) in formato ONNX da andraniksargsyan/migan."
          fi
          if ! gh release view sam2-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p sam2
            curl -L --fail --retry 3 -o sam2/sam2_hiera_tiny.encoder.onnx \
              https://huggingface.co/vietanhdev/segment-anything-2-onnx-models/resolve/main/sam2_hiera_tiny.encoder.onnx
            curl -L --fail --retry 3 -o sam2/sam2_hiera_tiny.decoder.onnx \
              https://huggingface.co/vietanhdev/segment-anything-2-onnx-models/resolve/main/sam2_hiera_tiny.decoder.onnx
            gh release create sam2-v1 sam2/*.onnx --repo "$GITHUB_REPOSITORY" --latest=false \
              --title "SAM 2 Tiny ONNX" --notes "SAM 2 Hiera Tiny (Apache-2.0, Meta) in formato ONNX da vietanhdev/segment-anything-2-onnx-models."
          fi

  build:
    if: ${{ !inputs.only_models }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Segreto KEYSTORE_BASE64 mancante: APK con chiave di debug, release NON pubblicata"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: MagicTouchRemove2026
          KEY_ALIAS: magictouch
          KEY_PASSWORD: MagicTouchRemove2026
        run: |
          set -o pipefail
          gradle :app:assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: " build.log | head -20 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MagicTouchRemove-v1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MagicTouchRemove-apk
          path: MagicTouchRemove-v1.${{ github.run_number }}.apk
      - name: Publish GitHub Release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          NOTES=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          [ -z "$NOTES" ] && NOTES="Build automatica"
          gh release create "v1.${{ github.run_number }}" "MagicTouchRemove-v1.${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --title "Magic Touch Remove v1.${{ github.run_number }}" \
            --notes "$NOTES"
